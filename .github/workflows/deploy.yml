name: Deploy Frontend to Production

on:
  push:
    branches:
      - frontend # Запускать, только когда происходит push в ветку 'frontend'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: frontend # Убедиться, что мы работаем именно с веткой 'frontend'

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.2' # Используйте версию Node.js, необходимую для Vite

      - name: Install dependencies
        run: npm install

      - name: Build the project (Vite)
        run: npm run build # Убедитесь, что эта команда запускает сборку (обычно 'npm run build')

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*" # Папка, куда Vite собирает готовые файлы (обычно 'dist')
          target: "/home/app/frontend-app" # Путь на сервере, куда нужно скопировать файлы
          strip_components: 1 # Убрать папку 'dist' из пути при копировании

      - name: Restart Nginx Service (Optional but Recommended)
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart nginx
            echo "Deployment successful and Nginx restarted!"